group 'io.github.mictaege'
version '2026.3-rc3'

apply plugin: 'java'
apply plugin: 'jitter'
apply plugin: 'application'
apply plugin: 'idea'
apply plugin: 'org.openjfx.javafxplugin'
apply plugin: 'org.jetbrains.kotlin.jvm'

java {
    sourceCompatibility = 21
    targetCompatibility = 21
}


wrapper {
    gradleVersion = "9.8.0"
    distributionType = Wrapper.DistributionType.ALL
}

buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath group: 'io.github.mictaege', name: 'jitter-plugin', version:'2026.3-rc3'
        classpath 'org.openjfx:javafx-plugin:0.1.0'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
    }
}

repositories {
    mavenCentral()
}

// The full (150%) classes and processed resources of a source set: under
// jitter the source set OUTPUT is the flavour-stripped tree, so a consumer
// source set must compile against the compile task outputs instead - the
// runtime classpath keeps the stripped output (the flavour model at runtime)
def fullOf = { String srcSetName ->
    def suffix = srcSetName == 'main' ? '' : srcSetName.capitalize()
    files(tasks.named("compile${suffix}Java"), tasks.named("process${suffix}Resources"))
}

sourceSets {
    model {
        java {
            srcDir 'src/model/java'
        }
        // the Kotlin flavour of the model sources: the demo of the Kotlin
        // dejittering, the Kotlin sources live beside the Java sources
        kotlin {
            srcDir 'src/model/java'
        }
        resources {
            srcDir 'src/model/resources'
        }
    }
    modelTest {
        compileClasspath += model.compileClasspath + fullOf('model')
        runtimeClasspath += model.runtimeClasspath
        java {
            srcDir 'src/modelTest/java '
        }
        resources {
            srcDir 'src/modelTest/resources'
        }
    }
    beans {
        compileClasspath += model.compileClasspath + fullOf('model')
        runtimeClasspath += model.runtimeClasspath
        java {
            srcDir 'src/beans/java'
        }
        resources {
            srcDir 'src/beans/resources'
        }
    }
    beansTest {
        compileClasspath += beans.compileClasspath + modelTest.compileClasspath + fullOf('beans') + fullOf('modelTest')
        runtimeClasspath += beans.runtimeClasspath + modelTest.runtimeClasspath
        java {
            srcDir 'src/beansTest/java'
        }
        resources {
            srcDir 'src/beansTest/resources'
        }
    }
    ui {
        compileClasspath += beans.compileClasspath + fullOf('beans')
        runtimeClasspath += beans.runtimeClasspath
        java {
            srcDir 'src/ui/java'
        }
        resources {
            srcDir 'src/ui/resources'
        }
    }
    uiTest {
        compileClasspath += ui.compileClasspath + beansTest.compileClasspath + fullOf('ui') + fullOf('beansTest')
        runtimeClasspath += ui.runtimeClasspath + beansTest.runtimeClasspath
        java {
            srcDir 'src/uiTest/java'
        }
        resources {
            srcDir 'src/uiTest/resources'
        }
    }
    main {
        compileClasspath += ui.compileClasspath + fullOf('ui')
        runtimeClasspath += ui.runtimeClasspath
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'src/main/resources'
        }
    }
    test {
        compileClasspath += main.compileClasspath + uiTest.compileClasspath + fullOf('main') + fullOf('uiTest')
        runtimeClasspath += main.runtimeClasspath + uiTest.runtimeClasspath
        java {
            srcDir 'src/test/java'
        }
        resources {
            srcDir 'src/test/resources'
        }
    }
}

tasks.compileJava.dependsOn tasks.compileUiJava
tasks.compileUiJava.dependsOn tasks.compileBeansJava
tasks.compileBeansJava.dependsOn tasks.compileModelJava

tasks.compileTestJava.dependsOn tasks.compileUiTestJava
tasks.compileUiTestJava.dependsOn tasks.compileBeansTestJava
tasks.compileBeansTestJava.dependsOn tasks.compileModelTestJava

dependencies {
    modelImplementation "io.github.mictaege:jitter-api:2026.3-rc3"
    modelImplementation "org.jetbrains.kotlin:kotlin-stdlib:2.4.21"
    testImplementation(platform("org.junit:junit-bom:5.12.2"))
    testImplementation("org.junit.jupiter:junit-jupiter-api")
    testImplementation("org.junit.jupiter:junit-jupiter-engine")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.12.2")
    // the custom api source set of the simulator, selected by capability
    // like the standard testFixtures(...) notation does: the test compiles
    // against the full fixtures model (sharedFixturesApiElements) and runs
    // against the stripped model (the plugin replaced the runtime variant)
    testImplementation(project(':simulator')) {
        capabilities {
            requireCapability 'io.github.mictaege.eval:simulator-sharedFixtures:2026.3-rc3'
        }
    }
    modelTestImplementation "org.mockito:mockito-core:5.17.0"
    modelTestImplementation "org.concordion:concordion:4.0.1"
}

javafx {
    modules = [ 'javafx.controls', 'javafx.fxml' ]
    configurations = [ 'uiImplementation' ]
}

idea {
    module {
        inheritOutputDirs = false
        testSources.from(sourceSets.modelTest.java.srcDirs)
        testSources.from(sourceSets.beansTest.java.srcDirs)
        testSources.from(sourceSets.uiTest.java.srcDirs)
        outputDir file('build/classes/main')
        testOutputDir file('build/classes/test')
    }
}

application {
    mainClass = "com.github.mictaege.eval.jitter.TowerControlMain"
}

jar {
    from sourceSets.model.output
    from sourceSets.beans.output
    from sourceSets.ui.output
    from sourceSets.main.output
}

run {
    classpath sourceSets.main.runtimeClasspath
}

jitter {

    flavour {
        name = 'ESA'
        criticalTerms {
            patterns = ['\\b(?i)(esa)\\b', '\\b(?i)(hermes)\\b']
            patterns << 'Construction Year'
            excludes << '**/Flavour.java'
            includes << 'scripts/**'
            sizeLimitKb = 200
        }
    }

    flavour {
        name = 'NASA'
        criticalTerms {
            patterns = ['\\b(?i)(nasa)\\b', '\\b(?i)(mercury)\\b', '\\b(?i)(gemini)\\b']
            excludes << '**/*.html'
            excludes << '**/Flavour.java'
        }
    }

    flavour {
        name = 'ROSKOSMOS'
        criticalTerms {
            patterns = ['\\b(?i)(roskomos)\\b', '\\b(?i)(wostok)\\b', '\\b(?i)(sojus)\\b']
            excludes << '**/Flavour.java'
            includes << 'scripts/**'
        }
    }

    excludeSrcSets = ['main', 'test']

}

// the demo tests run with JUnit 5; the active flavour is read at execution
// time and passed to the test JVM - after the flavourXyz task of the same
// build has selected it
test {
    useJUnitPlatform()
    // the dejittered model demo reads the output of the aggregate dejitter
    // task, so the variant is fresh for the active flavour
    dependsOn 'dejitter'
    doFirst {
        systemProperty 'jitter.active.flavour', System.getProperty('jitter.active.flavour', '')
    }
}